name: CI - Build, Tests & Serenity Report

on:
  push:
    branches:
      - '**'

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Build + Unit Tests + Cucumber/Serenity
  # ─────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build + Tests + Serenity Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar build y tests
        run: mvn clean verify

      - name: Publicar reporte de Serenity como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serenity-report-${{ github.run_number }}
          path: target/site/serenity/
          retention-days: 30

      - name: Publicar reporte en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/estudiantes' && always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/serenity/
          destination_dir: serenity-report

      - name: Resumen del resultado
        if: always()
        run: |
          echo "## 🧪 Resultado de Tests BDD/TDD" >> $GITHUB_STEP_SUMMARY
          echo "Ver artefacto **serenity-report-${{ github.run_number }}** para el reporte completo." >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: ATDD con Playwright
  # ─────────────────────────────────────────────────────────────────
  atdd-playwright:
    name: ATDD - Playwright Tests
    runs-on: ubuntu-latest
    needs: build-and-test  # espera que el Job 1 pase primero

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Levantar backend con perfil local (H2)
        run: |
          mvn spring-boot:run -Dspring-boot.run.profiles=local &
          echo "Esperando que el backend levante en puerto 8080..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/room > /dev/null 2>&1; then
              echo "✅ Backend listo!"
              break
            fi
            echo "Intento $i/30 - esperando..."
            sleep 3
          done

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: atdd/package-lock.json

      - name: Instalar dependencias de Playwright
        working-directory: atdd
        run: npm ci

      - name: Instalar browsers de Playwright
        working-directory: atdd
        run: npx playwright install --with-deps chromium

      - name: Ejecutar tests ATDD
        working-directory: atdd
        run: npm test

      - name: Publicar reporte de Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: atdd/playwright-report/
          retention-days: 30

      - name: Resumen ATDD
        if: always()
        run: |
          echo "## 🎭 Resultado de Tests ATDD (Playwright)" >> $GITHUB_STEP_SUMMARY
          echo "Ver artefacto **playwright-report-${{ github.run_number }}** para el reporte completo." >> $GITHUB_STEP_SUMMARY