name: CI - Build, Tests & Serenity Report

on:
  push:
    branches:
      - '**'

jobs:
  build-and-test:
    name: Build + Tests + Serenity Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar build y tests
        run: mvn clean verify

      - name: Publicar reporte de Serenity
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serenity-report-${{ github.run_number }}
          path: target/site/serenity/
          retention-days: 30

      - name: Publicar reporte en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/estudiantes' && always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/serenity/
          destination_dir: serenity-report

      - name: Resumen del resultado
        if: always()
        run: |
          echo "## 🧪 Resultado de Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f target/site/serenity/serenity-summary.txt ]; then
            cat target/site/serenity/serenity-summary.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "Ver artefacto **serenity-report-${{ github.run_number }}** para el reporte completo." >> $GITHUB_STEP_SUMMARY
          fi